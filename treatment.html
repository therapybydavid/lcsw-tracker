<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treatment Progress Tracker</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #f3f3f0;
  --surface: #ffffff;
  --surface2: #f8f8f5;
  --border: rgba(0,0,0,0.1);
  --borderS: rgba(0,0,0,0.18);
  --t1: #1a1a1a;
  --t2: #555;
  --t3: #999;
  --blue: #185FA5;
  --blueBg: rgba(24,95,165,0.09);
  --red: #A32D2D;
  --redBg: rgba(163,45,45,0.09);
  --green: #3B6D11;
  --greenBg: rgba(59,109,17,0.09);
  --amber: #854F0B;
  --amberBg: rgba(133,79,11,0.09);
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;min-height:100vh}
h1{font-size:20px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:500}
p{color:var(--t2)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--t1)}

.center-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.pin-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 28px;width:290px;text-align:center}
.pin-icon{width:44px;height:44px;background:var(--blue);border-radius:10px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:20px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--borderS);background:transparent;transition:background .1s,border-color .1s}
.dot.on{background:var(--blue);border-color:var(--blue)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.pkey{padding:14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);font-size:18px;font-weight:500;transition:background .1s}
.pkey:hover{background:var(--surface2)}
.pkey:active{background:var(--blueBg)}
.perr{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10}
.nav-l{display:flex;align-items:center;gap:10px}
.nav-r{display:flex;gap:8px;align-items:center}
.ntitle{font-size:15px;font-weight:600}
.nsub{font-size:10px;color:var(--t3)}

.sync-ind{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600}
.sync-ok{background:var(--greenBg);color:var(--green)}
.sync-saving{background:var(--amberBg);color:var(--amber)}
.sync-err{background:var(--redBg);color:var(--red)}

.tabs{display:flex;gap:3px;padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
.tab{padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;border-radius:var(--rs) var(--rs) 0 0;color:var(--t3);border:1px solid transparent;border-bottom:none;white-space:nowrap;transition:all .15s}
.tab.on{background:var(--bg);color:var(--t1);border-color:var(--border);border-bottom-color:var(--bg);position:relative;top:1px}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--borderS);background:var(--surface);color:var(--t1);font-size:12px;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.75}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{background:var(--redBg);color:var(--red);border-color:rgba(163,45,45,.3)}
.btn.sm{padding:5px 10px;font-size:11px}

.field{margin-bottom:13px}
.field label{display:block;font-size:10px;font-weight:600;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--borderS);border-radius:var(--rs);background:var(--surface);color:var(--t1)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.field textarea{resize:vertical;min-height:65px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.bg{background:var(--greenBg);color:var(--green)}
.bb{background:var(--blueBg);color:var(--blue)}
.ba{background:var(--amberBg);color:var(--amber)}
.br{background:var(--redBg);color:var(--red)}

.alert{padding:10px 14px;border-radius:var(--rs);display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.adanger{background:var(--redBg);border:1px solid rgba(163,45,45,.2);color:var(--red)}
.awarning{background:var(--amberBg);border:1px solid rgba(133,79,11,.2);color:var(--amber)}
.ainfo{background:var(--blueBg);border:1px solid rgba(24,95,165,.2);color:var(--blue)}

.pb{height:6px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.pbf{height:100%;border-radius:3px;transition:width .3s}

.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:8px 13px;text-align:center}
.mval{font-size:18px;font-weight:700}
.mlbl{font-size:10px;color:var(--t3)}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.gcard{border-left:3px solid;padding:11px;border-radius:0 var(--rs) var(--rs) 0;background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}

.si{border:1px solid var(--border);border-radius:var(--rs);margin-bottom:8px;overflow:hidden}
.sh{padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--surface)}
.sh:hover{background:var(--surface2)}
.sb{display:none;padding:13px;background:var(--surface2);border-top:1px solid var(--border)}
.sb.open{display:block}

.srow{margin-bottom:13px;border-bottom:1px solid #eee;padding-bottom:13px}
.srow label{display:flex;justify-content:space-between;font-size:11px;font-weight:500;margin-bottom:5px}
.srow input[type=range]{width:100%;accent-color:var(--blue)}
.srow textarea{width:100%;margin-top:5px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--rs);font-size:11px;min-height:42px;resize:vertical;background:var(--surface)}

.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ccard:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(24,95,165,.1)}

.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.content{padding:20px;max-width:820px}
.content.wide{max-width:1100px}
.conf{font-size:10px;color:var(--t3);text-align:center;padding:12px;border-top:1px solid var(--border);margin-top:24px}

.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:580px){.frow{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.cgrid{grid-template-columns:1fr}.content{padding:14px}}
</style>
</head>
<body>
<div id="app"><div class="loading-wrap"><div class="spinner"></div><p style="font-size:12px;color:#aaa">Connecting...</p></div></div>

<script>
// ─── FIREBASE CONFIG ──────────────────────────────────────

const firebaseConfig = {
  apiKey: "AIzaSyARzjrwt_Asr-_ca5bBYUBoFUMKM8sRAFc",
  authDomain: "therapy-by-david.firebaseapp.com",
  databaseURL: "https://therapy-by-david-default-rtdb.firebaseio.com",
  projectId: "therapy-by-david",
  storageBucket: "therapy-by-david.firebasestorage.app",
  messagingSenderId: "45351635355",
  appId: "1:45351635355:web:034613da21afc66625793e",
  measurementId: "G-CWE2N88CN4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ─── CONSTANTS ────────────────────────────────────────────

const KEYS = { pin: 'txp_pin_v3' };
const SALT = 'txpSecure_2026';

const DEFAULT_GOALS = [
  {id:'g1',name:'Safety & Crisis Stabilization',cname:'Staying safe & grounded',color:'#E24B4A',
   desc:'Building tools to manage difficult moments and knowing when and how to reach out for support. Recognizing your warning signs early and having a clear plan when things feel overwhelming.'},
  {id:'g2',name:'Trauma Processing & Integration',cname:'Understanding my story',color:'#7F77DD',
   desc:'Making sense of your past so it has less power over your present. Understanding how early experiences shaped your patterns — not to stay stuck there, but to stop being run by them.'},
  {id:'g3',name:'Emotional Regulation & Anger Mgmt',cname:'Managing my emotions',color:'#EF9F27',
   desc:'Learning to feel your emotions fully without being controlled by them. Catching the moment before a reaction and choosing how you respond — especially in relationships that tend to trigger you.'},
  {id:'g4',name:'Cognitive Restructuring & Self-Worth',cname:'Changing my inner narrative',color:'#378ADD',
   desc:'Replacing the stories you were given about yourself with ones that are actually true. Identifying where negative beliefs came from and building evidence for who you really are.'},
  {id:'g5',name:'Boundaries & Interpersonal Effectiveness',cname:'Setting healthy limits',color:'#1D9E75',
   desc:'Knowing what you will and won\'t accept — and being able to say it clearly without guilt. Learning the difference between people-pleasing and genuine care, and where your limits actually live.'},
  {id:'g6',name:'Identity & Future Orientation',cname:'Building my future',color:'#639922',
   desc:'Getting clear on who you are, what you value, and where you\'re going — so that your decisions come from that place instead of fear or habit. Building toward a life that actually fits you.'},
];

// ─── STATE ────────────────────────────────────────────────

const S = {
  view: 'pin', clients: [], cid: null, ctab: 'dashboard',
  pinEntry: '', pinAttempts: 0,
  setupStep: 1, setupPin: '',
  expanded: null, syncStatus: 'ok', loaded: false,
};

function gc() { return S.clients.find(c => c.id === S.cid) }

// ─── FIREBASE STORAGE ─────────────────────────────────────

let fbRef = db.ref('treatment_clients');
let fbListener = null;

function startListening() {
  if (fbListener) fbRef.off('value', fbListener);
  fbListener = fbRef.on('value', snap => {
    const data = snap.val();
    if (data) {
      S.clients = Object.values(data);
    } else {
      S.clients = [];
    }
    S.syncStatus = 'ok';
    S.loaded = true;
    if (S.view !== 'pin' && S.view !== 'setup') render();
  }, err => {
    console.error('Firebase read error:', err);
    S.syncStatus = 'err';
    S.loaded = true;
    render();
  });
}

function saveAll() {
  S.syncStatus = 'saving';
  render();
  const data = {};
  S.clients.forEach(c => { data[c.id] = c });
  fbRef.set(data).then(() => {
    S.syncStatus = 'ok';
    render();
  }).catch(err => {
    console.error('Firebase write error:', err);
    S.syncStatus = 'err';
    render();
  });
}

function saveClient(c) {
  S.syncStatus = 'saving';
  db.ref('treatment_clients/' + c.id).set(c).then(() => {
    S.syncStatus = 'ok';
    render();
  }).catch(err => {
    console.error('Firebase write error:', err);
    S.syncStatus = 'err';
    render();
  });
}

// ─── PIN / CRYPTO ─────────────────────────────────────────

async function hashPIN(pin) {
  const data = new TextEncoder().encode(pin + SALT);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function pinSet() { return !!localStorage.getItem(KEYS.pin) }
async function verifyPIN(pin) {
  const s = localStorage.getItem(KEYS.pin);
  if (!s) return false;
  return (await hashPIN(pin)) === s;
}
async function savePIN(pin) { localStorage.setItem(KEYS.pin, await hashPIN(pin)) }

// ─── NAVIGATION ───────────────────────────────────────────

function nav(view, opts = {}) {
  S.view = view; S.expanded = null;
  if (opts.cid !== undefined) S.cid = opts.cid;
  if (opts.tab) S.ctab = opts.tab;
  render(); window.scrollTo(0, 0);
}

// ─── HELPERS ──────────────────────────────────────────────

function fmt(d) {
  if (!d) return '—';
  const [y, m, dd] = d.split('-');
  return `${+m}/${+dd}/${y}`;
}
function uid() { return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }
function cuid() { return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) }

function status(p) {
  if (p >= 75) return { l: 'Strong', c: 'bg' };
  if (p >= 60) return { l: 'Good progress', c: 'bb' };
  if (p >= 40) return { l: 'In progress', c: 'ba' };
  return { l: 'Needs focus', c: 'br' };
}
function phqSev(n) {
  if (n <= 4) return { l: 'Minimal', color: '#3B6D11' };
  if (n <= 9) return { l: 'Mild', color: '#639922' };
  if (n <= 14) return { l: 'Moderate', color: '#854F0B' };
  if (n <= 19) return { l: 'Mod. severe', color: '#A32D2D' };
  return { l: 'Severe', color: '#7B1111' };
}
function gadSev(n) {
  if (n <= 4) return { l: 'Minimal', color: '#3B6D11' };
  if (n <= 9) return { l: 'Mild', color: '#639922' };
  if (n <= 14) return { l: 'Moderate', color: '#854F0B' };
  return { l: 'Severe', color: '#A32D2D' };
}

function avgP(c) {
  if (!c.sessions || !c.sessions.length) return 0;
  const last = c.sessions[c.sessions.length - 1];
  return Math.round(c.goals.reduce((s, g) => s + (last.goals?.[g.id]?.progress ?? 0), 0) / c.goals.length);
}

function reco(c) {
  if (!c.sessions || !c.sessions.length) return [];
  const last = c.sessions[c.sessions.length - 1];
  const prev = c.sessions.length > 1 ? c.sessions[c.sessions.length - 2] : null;
  return c.goals.map(g => {
    const cur = last.goals?.[g.id]?.progress ?? 0;
    const prv = prev?.goals?.[g.id]?.progress;
    const dec = prv !== undefined && cur < prv;
    const flg = last.nextFocus?.includes(g.id);
    const sfLow = g.id === 'g1' && cur < 70;
    let pri = 0, rsn = '';
    if (sfLow) { pri = 100; rsn = 'Safety monitoring required' }
    else if (g.id === 'g1' && dec) { pri = 90; rsn = 'Safety declined — review' }
    else if (flg && dec) { pri = 80; rsn = 'Flagged + declined' }
    else if (flg) { pri = 70; rsn = 'Flagged for this session' }
    else if (dec) { pri = 55; rsn = `Declined ${prv - cur} pts since last` }
    else if (cur < 50) { pri = 35; rsn = 'Below 50% — needs attention' }
    else { pri = 0; rsn = 'Lowest current progress' }
    return { goal: g, cur, change: prv !== undefined ? cur - prv : null, pri, rsn };
  }).sort((a, b) => b.pri - a.pri || a.cur - b.cur).slice(0, 3);
}

// ─── SVG CHARTS ───────────────────────────────────────────

function lineChart(sessions, goals, w, h) {
  if (!sessions || sessions.length < 2)
    return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px">Add more sessions to see trends</div>`;
  const pl = 32, pr = 12, pt = 10, pb = 28, cw = w - pl - pr, ch = h - pt - pb;
  const xs = sessions.length > 1 ? cw / (sessions.length - 1) : cw;
  const ys = v => ch - Math.min(100, Math.max(0, v)) / 100 * ch;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block"><g transform="translate(${pl},${pt})">`;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = ys(v).toFixed(1);
    s += `<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="#e8e8e4" stroke-width="1"/>`;
    s += `<text x="-4" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="#bbb" font-family="sans-serif">${v}</text>`;
  });
  sessions.forEach((ss, i) => {
    s += `<text x="${(i * xs).toFixed(1)}" y="${(ch + 19).toFixed(1)}" text-anchor="middle" font-size="10" fill="#bbb" font-family="sans-serif">S${ss.sessionNum}</text>`;
  });
  goals.forEach(g => {
    const pts = sessions.map((ss, i) => `${(i * xs).toFixed(1)},${ys(ss.goals?.[g.id]?.progress ?? 0).toFixed(1)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${g.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    sessions.forEach((ss, i) => {
      s += `<circle cx="${(i * xs).toFixed(1)}" cy="${ys(ss.goals?.[g.id]?.progress ?? 0).toFixed(1)}" r="3.5" fill="${g.color}" stroke="white" stroke-width="1.5"/>`;
    });
  });
  s += '</g></svg>';
  return s;
}

function phqChart(sessions, w, h) {
  const sc = sessions.filter(s => s.phq9 !== null && s.phq9 !== undefined);
  if (sc.length < 2)
    return `<div style="height:${h}px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px">${sc.length === 1 ? `Baseline — PHQ-9: ${sc[0].phq9} · GAD-7: ${sc[0].gad7} · Add more to see trend` : 'No assessment scores recorded yet'}</div>`;
  const pl = 32, pr = 12, pt = 10, pb = 28, cw = w - pl - pr, ch = h - pt - pb;
  const xs = sc.length > 1 ? cw / (sc.length - 1) : cw;
  const ys = v => ch - Math.min(27, Math.max(0, v)) / 27 * ch;
  let s = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block"><g transform="translate(${pl},${pt})">`;
  [0, 9, 14, 19, 27].forEach(v => {
    const y = ys(v).toFixed(1);
    s += `<line x1="0" y1="${y}" x2="${cw}" y2="${y}" stroke="#e8e8e4" stroke-width="1"/>`;
    s += `<text x="-4" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="#bbb" font-family="sans-serif">${v}</text>`;
  });
  sc.forEach((ss, i) => {
    s += `<text x="${(i * xs).toFixed(1)}" y="${(ch + 19).toFixed(1)}" text-anchor="middle" font-size="10" fill="#bbb" font-family="sans-serif">S${ss.sessionNum}</text>`;
  });
  const phqPts = sc.map((ss, i) => `${(i * xs).toFixed(1)},${ys(ss.phq9).toFixed(1)}`).join(' ');
  s += `<polyline points="${phqPts}" fill="none" stroke="#E24B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  sc.forEach((ss, i) => {
    s += `<circle cx="${(i * xs).toFixed(1)}" cy="${ys(ss.phq9).toFixed(1)}" r="3.5" fill="#E24B4A" stroke="white" stroke-width="1.5"/>`;
  });
  if (sc.some(ss => ss.gad7 !== null && ss.gad7 !== undefined)) {
    const gsc = sc.filter(ss => ss.gad7 !== null && ss.gad7 !== undefined);
    const gPts = gsc.map((ss, i) => `${(i * xs).toFixed(1)},${ys(ss.gad7).toFixed(1)}`).join(' ');
    s += `<polyline points="${gPts}" fill="none" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    gsc.forEach((ss, i) => {
      s += `<circle cx="${(i * xs).toFixed(1)}" cy="${ys(ss.gad7).toFixed(1)}" r="3.5" fill="#EF9F27" stroke="white" stroke-width="1.5"/>`;
    });
  }
  s += `</g><text x="${pl}" y="${h - 3}" font-size="9" fill="#E24B4A" font-family="sans-serif">■ PHQ-9</text>`;
  s += `<text x="${pl + 58}" y="${h - 3}" font-size="9" fill="#EF9F27" font-family="sans-serif">■ GAD-7</text>`;
  s += '</svg>';
  return s;
}

// ─── RENDER ───────────────────────────────────────────────

function render() {
  document.getElementById('app').innerHTML = {
    pin: rPIN, setup: rSetup, clients: rClients,
    client: rClient, addClient: rAddClient, settings: rSettings
  }[S.view]?.() ?? '';
  bindEvents();
}

function syncBadge() {
  if (S.syncStatus === 'saving') return '<span class="sync-ind sync-saving">Saving...</span>';
  if (S.syncStatus === 'err') return '<span class="sync-ind sync-err">Sync error</span>';
  return '<span class="sync-ind sync-ok">Synced</span>';
}

// PIN SCREEN
function rPIN() {
  return `<div class="center-wrap"><div class="pin-card">
    <div class="pin-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1 style="font-size:17px;margin-bottom:3px">Treatment Tracker</h1>
    <p style="font-size:12px">Enter your PIN to continue</p>
    <div class="pin-dots">${[0, 1, 2, 3].map(i => `<div class="dot ${S.pinEntry.length > i ? 'on' : ''}"></div>`).join('')}</div>
    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pkey" data-pk="${n}">${n}</button>`).join('')}<div></div><button class="pkey" data-pk="0">0</button><button class="pkey" data-pk="del">⌫</button></div>
    <div class="perr">${S.pinAttempts > 0 ? 'Incorrect PIN. Try again.' : ''}</div>
    <p style="font-size:9px;color:#ccc;margin-top:12px">Cloud-synced · Firebase</p>
  </div></div>`;
}

// SETUP SCREEN
function rSetup() {
  const confirm = S.setupStep === 2;
  return `<div class="center-wrap"><div class="pin-card">
    <div class="pin-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <h1 style="font-size:17px;margin-bottom:3px">${confirm ? 'Confirm your PIN' : 'Create your PIN'}</h1>
    <p style="font-size:12px">${confirm ? 'Enter the same PIN again' : 'Choose a 4-digit PIN to protect all client data'}</p>
    <div class="pin-dots">${[0, 1, 2, 3].map(i => `<div class="dot ${S.pinEntry.length > i ? 'on' : ''}"></div>`).join('')}</div>
    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pkey" data-pk="${n}">${n}</button>`).join('')}<div></div><button class="pkey" data-pk="0">0</button><button class="pkey" data-pk="del">⌫</button></div>
    <div class="perr">${S.pinAttempts > 0 ? "PINs didn't match. Try again." : 'Step ' + (S.setupStep) + ' of 2'}</div>
  </div></div>`;
}

// CLIENT LIST
function rClients() {
  const cards = S.clients.length === 0
    ? `<div style="text-align:center;padding:48px 20px;color:#bbb"><p style="font-size:15px;margin-bottom:6px">No clients yet</p><p style="font-size:12px">Click "New Client" to get started</p></div>`
    : S.clients.map(c => {
      const sess = c.sessions || [];
      const last = sess[sess.length - 1];
      const avg = avgP(c);
      const sflg = last?.safetyFlag;
      const sBadge = c.status === 'active' ? '<span class="badge bg">Active</span>' : c.status === 'inactive' ? '<span class="badge ba">Inactive</span>' : '<span class="badge" style="background:#f0f0ee;color:#888">Discharged</span>';
      return `<div class="ccard" data-nc="${c.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div><div style="display:flex;align-items:center;gap:7px;margin-bottom:3px">
            <h2 style="font-size:15px">${c.name}</h2>${sBadge}
            ${sflg ? '<span class="badge br">&#9888; Safety</span>' : ''}
          </div>
          <p style="font-size:11px;color:#aaa">${sess.length} session${sess.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Last: ${fmt(last?.date)}</p></div>
          <div style="text-align:right"><div style="font-size:20px;font-weight:700;color:${avg >= 65 ? '#3B6D11' : avg >= 45 ? '#185FA5' : '#854F0B'}">${avg}%</div><div style="font-size:10px;color:#aaa">avg progress</div></div>
        </div>
        <div style="display:flex;gap:4px">${c.goals.map(g => {
          const p = last?.goals?.[g.id]?.progress ?? 0;
          return `<div style="flex:1;height:4px;background:#eee;border-radius:2px;overflow:hidden" title="${g.name}: ${p}%"><div style="height:100%;width:${p}%;background:${g.color}"></div></div>`;
        }).join('')}</div>
      </div>`;
    }).join('');
  return `
    <div class="nav"><div class="nav-l"><span class="ntitle">Treatment Tracker</span>${syncBadge()}</div>
      <div class="nav-r"><button class="btn sm" data-nv="settings">Settings</button><button class="btn sm primary" data-nv="addClient">+ New Client</button></div>
    </div>
    <div class="content" style="max-width:700px">
      <div style="margin-bottom:16px"><h2>Your caseload</h2><p style="font-size:11px;color:#aaa">${S.clients.length} client${S.clients.length !== 1 ? 's' : ''}</p></div>
      <div class="cgrid" style="grid-template-columns:1fr">${cards}</div>
    </div>
    <div class="conf">Treatment Progress Tracker &nbsp;·&nbsp; Cloud-synced via Firebase &nbsp;·&nbsp; Confidential</div>`;
}

// CLIENT DETAIL WRAPPER
function rClient() {
  const c = gc(); if (!c) return '<p style="padding:20px">Client not found</p>';
  const sess = c.sessions || [];
  const last = sess[sess.length - 1];
  const sflg = last?.safetyFlag;
  const tabs = [['dashboard', 'Dashboard'], ['history', 'Session History'], ['addSession', '+ Add Session'], ['clientView', 'Client View']];
  let content = '';
  if (S.ctab === 'dashboard') content = rDash(c);
  else if (S.ctab === 'history') content = rHistory(c);
  else if (S.ctab === 'addSession') content = rAddSess(c);
  else if (S.ctab === 'clientView') content = rCView(c);
  return `
    <div class="nav">
      <div class="nav-l"><button class="btn sm" data-nv="clients">&#8592;</button>
        <div><div class="ntitle">${c.name}</div><div class="nsub">${c.therapist} &nbsp;·&nbsp; ${sess.length} sessions</div></div>
        ${syncBadge()}
      </div>
      <div class="nav-r">${sflg ? '<span class="badge br" style="font-size:11px;padding:4px 8px">&#9888; Safety flag</span>' : ''}
        <button class="btn sm primary" data-tab="addSession">+ Add Session</button>
      </div>
    </div>
    <div class="tabs">${tabs.map(([t, l]) => `<div class="tab ${S.ctab === t ? 'on' : ''}" data-tab="${t}">${l}</div>`).join('')}</div>
    <div style="background:var(--bg)">${content}</div>`;
}

// DASHBOARD
function rDash(c) {
  const sess = c.sessions || [];
  const last = sess[sess.length - 1];
  const prev = sess.length > 1 ? sess[sess.length - 2] : null;
  const rec = reco(c);
  const avg = avgP(c);
  const days = sess.length > 0 ? Math.round((Date.now() - new Date(sess[0].date)) / (864e5)) : 0;
  const sflg = last?.safetyFlag;
  const lastPHQ = [...sess].reverse().find(s => s.phq9 !== null && s.phq9 !== undefined);
  const lastGAD = [...sess].reverse().find(s => s.gad7 !== null && s.gad7 !== undefined);
  const phqVal = lastPHQ ? `${lastPHQ.phq9}` : '—';
  const gadVal = lastGAD ? `${lastGAD.gad7}` : '—';
  const phqSevLabel = lastPHQ ? phqSev(lastPHQ.phq9).l : '';
  const phqSevColor = lastPHQ ? phqSev(lastPHQ.phq9).color : '#aaa';
  const gadSevLabel = lastGAD ? gadSev(lastGAD.gad7).l : '';
  const gadSevColor = lastGAD ? gadSev(lastGAD.gad7).color : '#aaa';
  const phqLbl = lastPHQ && lastPHQ.id !== last?.id ? `PHQ-9 (S${lastPHQ.sessionNum})` : 'Last PHQ-9';
  const gadLbl = lastGAD && lastGAD.id !== last?.id ? `GAD-7 (S${lastGAD.sessionNum})` : 'Last GAD-7';
  return `<div class="content wide">
    ${sflg ? `<div class="alert adanger"><div style="width:8px;height:8px;border-radius:50%;background:#A32D2D;flex-shrink:0;margin-top:3px"></div><div style="font-size:12px"><strong>Safety flag active — most recent session.</strong> ${(last.sessionNote || '').slice(0, 130)}${(last.sessionNote || '').length > 130 ? '…' : ''}</div></div>` : ''}
    <div class="metrics">
      ${[[sess.length, 'Sessions'], [avg + '%', 'Avg progress'], [days + 'd', 'In treatment']].map(([v, l]) =>
        `<div class="metric"><div class="mval">${v}</div><div class="mlbl">${l}</div></div>`).join('')}
      <div class="metric"><div class="mval">${phqVal}</div><div class="mlbl">${phqLbl}</div>${phqSevLabel ? `<div style="font-size:10px;font-weight:600;color:${phqSevColor};margin-top:1px">${phqSevLabel}</div>` : ''}</div>
      <div class="metric"><div class="mval">${gadVal}</div><div class="mlbl">${gadLbl}</div>${gadSevLabel ? `<div style="font-size:10px;font-weight:600;color:${gadSevColor};margin-top:1px">${gadSevLabel}</div>` : ''}</div>
    </div>
    <div class="two-col" style="margin-bottom:14px">
      <div class="card"><h3 style="margin-bottom:12px">Recommended focus — next session</h3>
        ${rec.length ? rec.map((r, i) => `<div style="${i > 0 ? 'border-top:1px solid #eee;padding-top:10px;margin-top:10px' : ''}display:flex;gap:10px;align-items:flex-start">
          <div style="width:24px;height:24px;border-radius:50%;background:${r.goal.color};color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${i + 1}</div>
          <div><div style="font-size:13px;font-weight:500">${r.goal.name}</div>
          <div style="font-size:11px;color:#888">${r.rsn} · ${r.cur}%${r.change !== null ? ` (${r.change >= 0 ? '+' : ''}${r.change})` : ''}</div></div></div>`).join('') : '<p style="font-size:12px;color:#bbb">Add sessions to see recommendations</p>'}
      </div>
      <div class="card"><h3 style="margin-bottom:10px">Last session · ${fmt(last?.date)}</h3>
        <p style="font-size:12px;line-height:1.6">${(last?.sessionNote || 'No sessions recorded yet.').slice(0, 210)}${(last?.sessionNote || '').length > 210 ? '…' : ''}</p>
        ${last?.nextFocus?.length ? `<div style="margin-top:10px;padding:6px 10px;background:#edf4fd;border-radius:6px"><p style="font-size:11px;color:var(--blue)"><strong>Flagged for today:</strong> ${last.nextFocus.map(id => c.goals.find(g => g.id === id)?.name.split(' ')[0]).filter(Boolean).join(', ')}</p></div>` : ''}
      </div>
    </div>
    <div style="margin-bottom:14px">
      <h3 style="margin-bottom:10px">Goal progress — current</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px">
        ${c.goals.map(g => {
          const cur = last?.goals?.[g.id]?.progress ?? 0;
          const prv = prev?.goals?.[g.id]?.progress;
          const chg = prv !== undefined ? cur - prv : null;
          const st = status(cur);
          return `<div class="gcard" style="border-left-color:${g.color}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">
              <span style="font-size:12px;font-weight:500;line-height:1.3;flex:1;padding-right:8px">${g.name}</span>
              <span class="badge ${st.c}">${st.l}</span>
            </div>
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px">
              <div class="pb" style="flex:1"><div class="pbf" style="width:${cur}%;background:${g.color}"></div></div>
              <span style="font-size:14px;font-weight:700;min-width:36px;text-align:right">${cur}%</span>
              ${chg !== null ? `<span style="font-size:11px;color:${chg >= 0 ? '#3B6D11' : '#A32D2D'};min-width:28px">${chg >= 0 ? '+' : ''}${chg}</span>` : ''}
            </div>
            ${last?.goals?.[g.id]?.note ? `<p style="font-size:10px;color:#777;line-height:1.5">${last.goals[g.id].note.slice(0, 100)}${last.goals[g.id].note.length > 100 ? '…' : ''}</p>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="chart-wrap"><h3 style="margin-bottom:10px">Progress over time — all goals</h3>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px">
        ${c.goals.map(g => `<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:${g.color}"></div><span style="font-size:10px;color:#777">${g.name.split(' ')[0]}</span></div>`).join('')}
      </div>
      ${lineChart(sess, c.goals, 720, 200)}
    </div>
    <div class="chart-wrap"><h3 style="margin-bottom:6px">Standardized measures (PHQ-9 / GAD-7)</h3>
      <p style="font-size:10px;color:#bbb;margin-bottom:8px">PHQ-9: 0–9 minimal/mild · 10–14 moderate · 15–19 mod-severe · 20–27 severe &nbsp;|&nbsp; GAD-7: 0–9 minimal/mild · 10–14 moderate · 15+ severe</p>
      ${phqChart(sess, 720, 180)}
    </div>
  </div>`;
}

// SESSION HISTORY
function rHistory(c) {
  const sess = c.sessions || [];
  if (!sess.length) return `<div class="content"><p style="color:#bbb;text-align:center;padding:48px">No sessions recorded yet.</p></div>`;
  return `<div class="content">
    <h3 style="margin-bottom:12px">Session history — ${sess.length} sessions</h3>
    ${[...sess].reverse().map(s => {
      const avg = Math.round(c.goals.reduce((sum, g) => sum + (s.goals?.[g.id]?.progress ?? 0), 0) / c.goals.length);
      const open = S.expanded === s.id;
      return `<div class="si"><div class="sh" data-toggle="${s.id}">
        <div style="display:flex;align-items:center;gap:9px;flex:1">
          <span style="font-weight:600;font-size:13px">Session ${s.sessionNum}</span>
          <span style="font-size:12px;color:#aaa">${fmt(s.date)}</span>
          ${s.safetyFlag ? '<span class="badge br">&#9888; Safety</span>' : ''}
          ${s.phq9 !== null && s.phq9 !== undefined ? `<span style="font-size:11px;color:#bbb">PHQ-9: ${s.phq9} · GAD-7: ${s.gad7}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:15px;font-weight:700">${avg}%</span>
          <span style="font-size:11px;color:#bbb">${open ? '▲' : '▼'}</span>
        </div>
      </div>
      <div class="sb ${open ? 'open' : ''}">
        ${s.sessionNote ? `<p style="font-size:12px;color:#555;line-height:1.65;margin-bottom:12px;background:white;padding:10px;border-radius:6px">${s.sessionNote}</p>` : ''}
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px">
          ${c.goals.map(g => `<div style="border-left:3px solid ${g.color};padding:8px 10px;background:white;border-radius:0 6px 6px 0">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:11px;font-weight:500">${g.name}</span>
              <span style="font-size:12px;font-weight:700">${s.goals?.[g.id]?.progress ?? 0}%</span>
            </div>
            ${s.goals?.[g.id]?.note ? `<p style="font-size:10px;color:#777;line-height:1.5">${s.goals[g.id].note}</p>` : ''}
          </div>`).join('')}
        </div>
        ${s.nextFocus?.length ? `<div style="margin-top:10px;padding:7px 10px;background:#edf4fd;border-radius:6px"><p style="font-size:11px;color:var(--blue)"><strong>Flagged for next session:</strong> ${s.nextFocus.map(id => c.goals.find(g => g.id === id)?.name).filter(Boolean).join(', ')}</p></div>` : ''}
      </div></div>`;
    }).join('')}
  </div>`;
}

// ADD SESSION FORM
function rAddSess(c) {
  const sess = c.sessions || [];
  const last = sess[sess.length - 1];
  const today = new Date().toISOString().split('T')[0];
  return `<div class="content">
    <p style="font-size:12px;color:#aaa;margin-bottom:16px">Session ${sess.length + 1} · Sliders default to last session values — only adjust what changed.</p>
    <form id="sf">
      <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:12px">Session details</h3>
        <div class="frow">
          <div class="field"><label>Date</label><input type="date" name="date" value="${today}" required></div>
          <div class="field"><label>PHQ-9 (0–27, optional)</label><input type="number" name="phq9" min="0" max="27" placeholder="Leave blank to skip"></div>
        </div>
        <div class="frow">
          <div class="field"><label>GAD-7 (0–21, optional)</label><input type="number" name="gad7" min="0" max="21" placeholder="Leave blank to skip"></div>
          <div class="field" style="display:flex;align-items:flex-end;padding-bottom:3px">
            <label style="display:flex;align-items:center;gap:7px;cursor:pointer;text-transform:none;font-size:13px;letter-spacing:0;font-weight:400">
              <input type="checkbox" name="safetyFlag"> Flag for safety monitoring
            </label>
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:14px">Goal progress this session</h3>
        ${c.goals.map(g => {
          const def = last?.goals?.[g.id]?.progress ?? 50;
          return `<div class="srow">
            <label><span style="display:flex;align-items:center;gap:7px"><div style="width:8px;height:8px;border-radius:50%;background:${g.color}"></div>${g.name}</span>
            <span style="color:${g.color};font-weight:700" id="v-${g.id}">${def}%</span></label>
            <input type="range" name="p-${g.id}" min="0" max="100" step="5" value="${def}"
              oninput="document.getElementById('v-${g.id}').textContent=this.value+'%'">
            <textarea name="n-${g.id}" placeholder="Notes for this goal (optional)…"></textarea>
          </div>`;
        }).join('')}
      </div>
      <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Session note</h3>
        <div class="field"><textarea name="sessionNote" style="min-height:90px" placeholder="Clinical narrative for this session…"></textarea></div>
      </div>
      <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:10px">Flag goals for next session</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px">
          ${c.goals.map(g => `<label style="display:flex;align-items:center;gap:5px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:5px 10px;font-size:12px">
            <input type="checkbox" name="f-${g.id}"> ${g.name.split(' ')[0]}
          </label>`).join('')}
        </div>
      </div>
      <button type="submit" class="btn primary" style="width:100%;justify-content:center;padding:11px;font-size:14px">Save Session</button>
    </form>
  </div>`;
}

// CLIENT VIEW
function rCView(c) {
  const sess = c.sessions || [];
  const last = sess[sess.length - 1];
  const first = sess[0];
  const rec = reco(c);
  return `<div class="content">
    <div class="alert ainfo" style="margin-bottom:20px">
      <div><h2 style="font-size:16px;margin-bottom:3px">Your treatment plan, ${c.name.split(' ')[0]}</h2>
      <p style="font-size:13px;color:var(--blue)">${sess.length} sessions completed · Started ${fmt(sess[0]?.date)}</p></div>
    </div>

    <h3 style="margin-bottom:4px">Your treatment goals</h3>
    <p style="font-size:12px;margin-bottom:14px">These are the areas we are working on together. Each one connects to what brought you here and where you want to go.</p>
    <div style="margin-bottom:24px">
      ${c.goals.map((g, i) => {
        const curP = last?.goals?.[g.id]?.progress ?? 0;
        const st = status(curP);
        return `<div style="display:flex;gap:14px;align-items:flex-start;padding:14px 0;${i > 0 ? 'border-top:1px solid #eee' : ''}">
          <div style="width:36px;height:36px;border-radius:50%;background:${g.color}18;border:2px solid ${g.color};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:${g.color}">${i + 1}</div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
              <span style="font-size:14px;font-weight:600">${g.cname}</span>
              <span class="badge ${st.c}">${st.l}</span>
            </div>
            <p style="font-size:12px;line-height:1.65;margin-bottom:8px">${g.desc || ''}</p>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="pb" style="flex:1;height:7px"><div class="pbf" style="height:100%;width:${curP}%;background:${g.color}"></div></div>
              <span style="font-size:13px;font-weight:700;min-width:36px">${curP}%</span>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>

    <h3 style="margin-bottom:10px">Your progress over time</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-bottom:22px">
      ${c.goals.map(g => {
        const startP = first?.goals?.[g.id]?.progress ?? 0;
        const curP = last?.goals?.[g.id]?.progress ?? 0;
        const gain = curP - startP;
        return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;border-top:3px solid ${g.color}">
          <div style="font-size:11px;font-weight:500;margin-bottom:6px">${g.cname}</div>
          <div style="display:flex;align-items:baseline;gap:6px">
            <span style="font-size:22px;font-weight:700;color:${g.color}">${curP}%</span>
            ${gain > 0 ? `<span style="font-size:11px;color:#3B6D11;font-weight:600">+${gain} since start</span>` : `<span style="font-size:11px;color:#aaa">getting started</span>`}
          </div>
        </div>`;
      }).join('')}
    </div>

    ${rec.length ? `<div class="card" style="background:var(--blueBg);border-color:rgba(24,95,165,.2)">
      <h3 style="margin-bottom:8px;color:var(--blue)">What we are focusing on right now</h3>
      ${rec.map((r, i) => `<div style="${i > 0 ? 'border-top:1px solid rgba(24,95,165,.12);padding-top:8px;margin-top:8px' : ''}">
        <p style="font-size:13px;font-weight:500;color:var(--t1)">${r.goal.cname}</p>
        <p style="font-size:12px;color:var(--t2)">${r.goal.desc || ''}</p>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}

// ADD CLIENT
function rAddClient() {
  return `<div class="nav"><div class="nav-l"><button class="btn sm" data-nv="clients">&#8592;</button><span class="ntitle">New Client</span></div></div>
  <div class="content"><form id="acf">
    <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:14px">Client information</h3>
      <div class="frow">
        <div class="field"><label>Full name *</label><input type="text" name="name" placeholder="First Last" required></div>
        <div class="field"><label>Date of birth *</label><input type="date" name="dob" required></div>
      </div>
      <div class="frow">
        <div class="field"><label>Start date</label><input type="date" name="startDate" value="${new Date().toISOString().split('T')[0]}"></div>
        <div class="field"><label>Therapist</label><input type="text" name="therapist" value="David Robles, LMSW"></div>
      </div>
      <div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
    </div>
    <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:6px">Treatment goals</h3>
      <p style="font-size:12px;color:#aaa;margin-bottom:12px">Standard 6-goal framework. Goals can be customized after creating the client.</p>
      ${DEFAULT_GOALS.map(g => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #eee">
        <div style="width:10px;height:10px;border-radius:50%;background:${g.color};flex-shrink:0"></div>
        <div><div style="font-size:13px;font-weight:500">${g.name}</div>
        <div style="font-size:10px;color:#aaa">Client label: "${g.cname}"</div></div>
      </div>`).join('')}
    </div>
    <button type="submit" class="btn primary" style="width:100%;justify-content:center;padding:11px;font-size:14px">Create Client</button>
  </form></div>`;
}

// SETTINGS
function rSettings() {
  return `<div class="nav"><div class="nav-l"><button class="btn sm" data-nv="clients">&#8592;</button><span class="ntitle">Settings</span></div></div>
  <div class="content" style="max-width:480px">
    <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Cloud sync</h3>
      <p style="font-size:12px;color:#888;margin-bottom:8px">All client data syncs in real time via Firebase. Access from any device, any browser — same data everywhere.</p>
      <div style="display:flex;align-items:center;gap:8px">${syncBadge()}<span style="font-size:11px;color:#aaa">${S.clients.length} client${S.clients.length !== 1 ? 's' : ''} synced</span></div>
    </div>
    <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Security</h3>
      <p style="font-size:12px;color:#888;margin-bottom:12px">Your PIN protects access on this device. Data is synced to Firebase cloud storage.</p>
      <button class="btn" id="chpinBtn">Change PIN</button>
    </div>
    <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Export backup</h3>
      <p style="font-size:12px;color:#888;margin-bottom:12px">Download all client data as a JSON file. Store on an encrypted drive or HIPAA-compliant cloud folder.</p>
      <button class="btn" id="exportBtn">Export all data (.json)</button>
    </div>
    <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Restore from backup</h3>
      <p style="font-size:12px;color:#888;margin-bottom:12px">Load a previously exported JSON backup. This replaces all current data in Firebase.</p>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button class="btn" id="importBtn">Import from backup</button>
    </div>
    <div class="card" style="border-color:rgba(163,45,45,.2)"><h3 style="margin-bottom:8px;color:var(--red)">Danger zone</h3>
      <p style="font-size:12px;color:#888;margin-bottom:12px">Permanently clear all data from Firebase and this device. Export a backup first. Cannot be undone.</p>
      <button class="btn danger" id="clearBtn">Clear all data</button>
    </div>
  </div>`;
}

// ─── EVENT BINDING ────────────────────────────────────────

function bindEvents() {
  document.querySelectorAll('[data-nv]').forEach(el => el.addEventListener('click', () => nav(el.dataset.nv)));
  document.querySelectorAll('[data-nc]').forEach(el => el.addEventListener('click', () => nav('client', { cid: el.dataset.nc, tab: 'dashboard' })));
  document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { S.ctab = el.dataset.tab; render() }));
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => { S.expanded = S.expanded === el.dataset.toggle ? null : el.dataset.toggle; render() }));

  // PIN pad
  document.querySelectorAll('[data-pk]').forEach(btn => btn.addEventListener('click', async () => {
    const v = btn.dataset.pk;
    if (v === 'del') { S.pinEntry = S.pinEntry.slice(0, -1) }
    else if (S.pinEntry.length < 4) { S.pinEntry += v }
    if (S.pinEntry.length === 4) {
      if (S.view === 'pin') {
        if (await verifyPIN(S.pinEntry)) { S.pinEntry = ''; S.pinAttempts = 0; startListening(); nav('clients') }
        else { S.pinAttempts++; S.pinEntry = ''; render() }
      } else if (S.view === 'setup') {
        if (S.setupStep === 1) { S.setupPin = S.pinEntry; S.pinEntry = ''; S.setupStep = 2; render() }
        else {
          if (S.pinEntry === S.setupPin) { await savePIN(S.pinEntry); S.pinEntry = ''; S.setupStep = 1; S.setupPin = ''; startListening(); nav('clients') }
          else { S.pinAttempts++; S.pinEntry = ''; S.setupStep = 1; S.setupPin = ''; render() }
        }
      }
    } else render();
  }));

  // Add session
  const sf = document.getElementById('sf');
  if (sf) sf.addEventListener('submit', e => {
    e.preventDefault();
    const c = gc(); if (!c) return;
    if (!c.sessions) c.sessions = [];
    const fd = new FormData(e.target);
    const goals = {};
    c.goals.forEach(g => {
      goals[g.id] = { progress: parseInt(fd.get('p-' + g.id)) || 0, note: fd.get('n-' + g.id) || '' };
    });
    const nf = c.goals.filter(g => fd.get('f-' + g.id) === 'on').map(g => g.id);
    const p9 = fd.get('phq9'), g7 = fd.get('gad7');
    c.sessions.push({
      id: uid(), sessionNum: c.sessions.length + 1, date: fd.get('date'),
      phq9: p9 !== '' && p9 !== null ? parseInt(p9) : null,
      gad7: g7 !== '' && g7 !== null ? parseInt(g7) : null,
      safetyFlag: fd.get('safetyFlag') === 'on',
      sessionNote: fd.get('sessionNote') || '', nextFocus: nf, goals
    });
    saveClient(c);
    S.ctab = 'dashboard'; render();
  });

  // Add client
  const acf = document.getElementById('acf');
  if (acf) acf.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const nc = {
      id: cuid(), name: fd.get('name'), dob: fd.get('dob'),
      startDate: fd.get('startDate') || new Date().toISOString().split('T')[0],
      therapist: fd.get('therapist') || 'David Robles, LMSW',
      status: fd.get('status'), goals: DEFAULT_GOALS.map(g => ({ ...g })), sessions: []
    };
    S.clients.push(nc);
    saveClient(nc);
    nav('client', { cid: nc.id, tab: 'dashboard' });
  });

  // Settings buttons
  const chpin = document.getElementById('chpinBtn');
  if (chpin) chpin.addEventListener('click', () => { S.pinEntry = ''; S.setupStep = 1; S.view = 'setup'; render() });

  const exp = document.getElementById('exportBtn');
  if (exp) exp.addEventListener('click', () => {
    const data = JSON.stringify({ clients: S.clients, exported: new Date().toISOString(), app: 'Treatment Tracker v2 — Firebase' }, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.download = `treatment-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
  });

  const impBtn = document.getElementById('importBtn');
  const impFile = document.getElementById('importFile');
  if (impBtn && impFile) {
    impBtn.addEventListener('click', () => impFile.click());
    impFile.addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.clients) {
            if (confirm(`Import ${d.clients.length} client(s)? This replaces all current data.`)) {
              S.clients = d.clients;
              saveAll();
              alert('Data imported and synced to Firebase. ' + d.clients.length + ' client(s) restored.');
              nav('clients');
            }
          } else alert('Invalid backup file.');
        } catch { alert('Could not read backup file.') }
      };
      r.readAsText(file);
    });
  }

  const clr = document.getElementById('clearBtn');
  if (clr) clr.addEventListener('click', () => {
    if (confirm('Clear ALL data permanently from Firebase? Export a backup first if needed. This cannot be undone.')) {
      fbRef.set(null).then(() => {
        localStorage.removeItem(KEYS.pin);
        location.reload();
      });
    }
  });
}

// ─── INIT ─────────────────────────────────────────────────

async function init() {
  if (await pinSet()) {
    nav('pin');
  } else {
    S.view = 'setup';
    render();
  }
}

init();
</script>
